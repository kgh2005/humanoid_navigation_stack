field_coordinate_adapter:
  ros__parameters:
    hz: 30.0
    output_frame_id: map
    zero_pixel_is_invalid: true  # 원본 픽셀 (0, 0)을 유효하지 않게 처리할지 여부

    field:
      width_px: 1100.0 # localization에서 가져오는 경기장 이미지의 픽셀 너비
      height_px: 800.0 # localization에서 가져오는 경기장 이미지의 픽셀 높이
      width_m: 24.0 # 경기장 가로 길이 + 여백
      height_m: 16.0 # 경기장 세로 길이 + 여백

    yaw_offset_deg: 90.0

    topics:
      input:
        localization: "/localization"
        imu: "/Imu"
        target: "/master2local"

      output:
        robot: /adapter/pose_marker
        obstacles: /adapter/obstacle_marker
        ball: /adapter/ball_marker
        target: /adapter/target_marker
        goal: /adapter/goal_marker
